  .fd-bar{stroke:var(--fd-n);stroke-width:1.40;stroke-linecap:round}
  .fd-wash{fill:var(--fd-n)}
  .fd-hatch{stroke:var(--fd-l);stroke-width:1.0;stroke-dasharray:1.2 3.4;stroke-linecap:round}
  .fd-ring{fill:none;stroke:var(--fd-l);stroke-width:1.00}
  .fd-frame{fill:none;stroke:var(--fd-n);stroke-width:1.30;stroke-dasharray:1.5 3.0;stroke-linecap:round}
  .fd-path{fill:none;stroke:var(--fd-l);stroke-width:1.00;stroke-dasharray:3.0 3.0}
  .fd-halo{stroke:var(--paper);stroke-width:4.0;fill:none;stroke-linecap:round}
  .fd-card{fill:var(--paper);opacity:.9}
</style>
