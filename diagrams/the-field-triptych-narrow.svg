<text x="16" y="64" class="s" font-size="12" text-anchor="start">the machine finds things here</text>
<text x="16" y="1024.923076923077" class="s" font-size="12" text-anchor="start">people make the nodes here</text>
<text x="16" y="1042.923076923077" class="s" font-size="11" text-anchor="start">its odds of a find rise with a concept’s</text>
<text x="16" y="1056.923076923077" class="s" font-size="11" text-anchor="start">connections; a node with none is not found,</text>
<text x="16" y="1070.923076923077" class="s" font-size="11" text-anchor="start">it is made</text>
<text x="16" y="28" class="t" font-size="17" text-anchor="start" font-weight="500">One network, cut three times</text>
