<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 436" width="900" height="436" role="img" aria-label="One network cut three times: where everything connects, where the joins are missing, and the forefront and past it, over a bar from the machine to people">
<title>One network cut three times: where everything connects, where the joins are missing, and the forefront and past it, over a bar from the machine to people</title>
<style>
  :root { --ink:#1c1b19; --muted:#6b675f; --rule:#e4e0d8; --paper:#fcfcfb; --water:#2a78d6; --warm:#d9602a; --tint:#eef1f6; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e8e5df; --muted:#9a968e; --rule:#2b2b33; --paper:#161615; --water:#4a90e2; --warm:#e8743f; --tint:#1d2733; } }
  .t { font-family: 'Newsreader Variable', Georgia, 'Times New Roman', serif; fill: var(--ink); }
  .s { font-family: 'Inter Variable', system-ui, -apple-system, 'Segoe UI', sans-serif; fill: var(--muted); }
  .ink { stroke: var(--ink); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .muted { stroke: var(--muted); fill: none; stroke-width: 1.6; stroke-linecap: round; }
  .rule { stroke: var(--rule); fill: none; stroke-width: 1; }
  .water { stroke: var(--water); fill: none; stroke-width: 2.2; stroke-linecap: round; }
  .warm { stroke: var(--warm); fill: none; stroke-width: 1.6; stroke-linecap: round; }
  .dash { stroke-dasharray: 4 5; }
  .fill-tint { fill: var(--tint); }
  .fill-rule { fill: var(--rule); }
  .fill-paper { fill: var(--paper); }
</style>
<style>
  :root{--fd-n:#46546a;--fd-l:#8d99aa}
  @media (prefers-color-scheme: dark){:root{--fd-n:#b4bfcd;--fd-l:#6f7a8a}}
  .fd-e{stroke:var(--fd-l);stroke-width:0.80;fill:none;opacity:.55}
  .fd-ge{stroke:var(--fd-l);stroke-width:0.90;fill:none;stroke-dasharray:2.0 2.6;opacity:.9}
  .fd-te{stroke:var(--fd-l);stroke-width:1.00;fill:none}
  .fd-p{fill:var(--fd-n);stroke:none}
  .fd-a{fill:var(--paper);stroke:var(--fd-n);stroke-width:1.30}
  .fd-c{fill:var(--paper);stroke:var(--fd-l);stroke-width:1.20}
