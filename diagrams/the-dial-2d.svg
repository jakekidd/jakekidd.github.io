<text x="30" y="30" class="t" font-size="18" text-anchor="start" font-weight="500">Two axes under the dial</text>
<text x="30" y="486" class="s" font-size="12" text-anchor="start">The dial collapses both onto one line.</text>
<text x="30" y="502" class="s" font-size="12" text-anchor="start">The late-arriving corner is where a judgment skill can become an answer-key skill, slowly.</text>
